<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Blackjack Bot</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1020;
        --panel: #141a32;
        --border: #263055;
        --accent: #3fb950;
        --danger: #f85149;
        --muted: #8b96b8;
        --text: #e6e9f2;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background: var(--bg);
        color: var(--text);
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100vh;
      }
      header {
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      header h1 { font-size: 15px; margin: 0; letter-spacing: 0.5px; }
      header .status { color: var(--muted); font-size: 12px; }
      header .status.running { color: var(--accent); }
      main {
        display: grid;
        grid-template-columns: 340px 1fr;
        min-height: 0;
      }
      .panel {
        border-right: 1px solid var(--border);
        padding: 18px 20px;
        overflow: auto;
      }
      .panel h2 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin: 0 0 12px; }
      label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
      input, select {
        width: 100%; background: var(--panel); color: var(--text);
        border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
        font-family: inherit; font-size: 13px;
      }
      button {
        width: 100%; padding: 10px; border: 0; border-radius: 6px;
        font-family: inherit; font-size: 13px; font-weight: 600;
        cursor: pointer; margin-top: 14px;
      }
      .btn-start { background: var(--accent); color: #0b1020; }
      .btn-stop  { background: var(--danger); color: #fff; }
      .btn-start:disabled, .btn-stop:disabled { opacity: 0.4; cursor: not-allowed; }
      .stats { font-size: 12px; color: var(--muted); line-height: 1.9; margin-top: 16px; }
      .stats b { color: var(--text); }
      #log {
        padding: 12px 16px; overflow: auto; font-size: 12px;
        background: #07091a;
      }
      .line { white-space: pre-wrap; padding: 2px 0; }
      .line.err { color: var(--danger); }
      .line.ok  { color: var(--accent); }
      .line.dim { color: var(--muted); }
      footer { padding: 8px 20px; border-top: 1px solid var(--border); font-size: 11px; color: var(--muted); }
    </style>
  </head>
  <body>
    <header>
      <h1>Blackjack Bot — Autonomous Player</h1>
      <span class="status" id="status">idle</span>
    </header>
    <main>
      <aside class="panel">
        <h2>Session</h2>
        <label for="site">Table</label>
        <select id="site">
          <option value="bundled">Bundled local game (default)</option>
          <option value="wizardofodds">Wizard of Odds — selectors may need tuning</option>
        </select>
        <label for="url">Override URL (leave blank for default)</label>
        <input id="url" placeholder="auto — file:// for bundled, site URL otherwise" />
        <label for="unit">Unit bet ($)</label>
        <input id="unit" type="number" value="25" min="1" />
        <label for="bankroll">Starting bankroll ($)</label>
        <input id="bankroll" type="number" value="10000" min="0" />
        <label for="mode">Mode</label>
        <select id="mode">
          <option value="spread">Count + 1-to-12 bet spread</option>
          <option value="flat">Flat bets (basic strategy only)</option>
          <option value="wong">Spread + Wong out on TC&lt;0</option>
        </select>
        <label for="speed">Action delay (ms)</label>
        <input id="speed" type="number" value="600" min="100" step="50" />
        <label for="rounds">Stop after N rounds (0 = unlimited)</label>
        <input id="rounds" type="number" value="0" min="0" />
        <button id="start" class="btn-start">Start</button>
        <button id="stop"  class="btn-stop" disabled>Stop</button>
        <div class="stats" id="stats">
          <div>Rounds: <b id="s-rounds">0</b></div>
          <div>Bankroll: <b id="s-bank">$0</b></div>
          <div>P&L: <b id="s-pnl">$0</b></div>
          <div>W / L / Push: <b id="s-wlp">0 / 0 / 0</b></div>
          <div>Running / True count: <b id="s-count">0 / 0.0</b></div>
        </div>
      </aside>
      <section id="log"></section>
    </main>
    <footer>
      First run: click Start. A Chromium window will open, navigate to the game, and play autonomously. Stop anytime.
    </footer>
    <script src="./renderer.js"></script>
  </body>
</html>
